<!DOCTYPE html>
<html>
<head><title>Efikcoin Explorer - Chain ID 20488</title>
<meta name="viewport" content="width=device-width">
<style>body{background:#000;color:#0f0;font-family:monospace;padding:20px} .box{border:1px solid #0f0;padding:15px;margin:10px 0} h1{color:#fff}</style>
</head>
<body>
<h1>Efikcoin Chain Explorer</h1>
<div class="box">Chain ID: 20488 | Symbol: EFC | RPC: rpc.efikcoin.com/rpc | Founder: 0xC5AD5c...7cCA</div>
<div class="box" id="status">Connecting to Chain 20488...</div>
<div class="box"><h3>Latest Block</h3><div id="block">Loading...</div></div>
<div class="box"><h3>Check Address</h3><input id="addr" placeholder="0x..." style="width:80%"><button onclick="checkBal()">Check</button><div id="bal"></div></div>
<script>
async function rpc(method, params=[]){
  const res = await fetch("https://rpc.efikcoin.com/rpc", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({jsonrpc:"2.0", id:1, method, params})
  });
  return (await res.json()).result;
}
async function load(){
  try{
    const chain = await rpc("eth_chainId");
    const block = await rpc("eth_blockNumber");
    document.getElementById("status").innerHTML = `✅ Connected! Chain ID: ${parseInt(chain,16)} (${chain}) | Block: ${parseInt(block,16)}`;
    document.getElementById("block").innerHTML = `Block Number: ${parseInt(block,16)}<br>Chain ID Verified: 20488 = 0x5008<br>Gas Token: EFC`;
  }catch(e){
    document.getElementById("status").innerHTML = "❌ RPC offline - deploy worker: "+e;
  }
}
async function checkBal(){
  const addr = document.getElementById("addr").value;
  const bal = await rpc("eth_getBalance", [addr, "latest"]);
  document.getElementById("bal").innerHTML = `Balance: ${parseInt(bal,16)/1e18} EFC on Chain 20488`;
}
load();
</script>
</body>
</html>
